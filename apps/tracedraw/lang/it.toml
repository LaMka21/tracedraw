web.notice_title = "TraceDraw nel browser"
web.notice_text = "È lo stesso programma Rust dell'app desktop, compilato in WebAssembly per provarlo senza installare nulla. Un browser è più lento: disegni grandi, effetti pesanti e file grandi richiedono più tempo, sono disponibili solo i font inclusi, e i file si aprono caricandoli e si salvano come download. Per il lavoro vero e i file grandi usa l'app per Windows, macOS o Linux: gira in modo nativo, alla massima velocità."
