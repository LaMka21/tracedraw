welcome.learn_1_body = "টুলবক্স থেকে একটি টুল বেছে নিন (ফ্লাইআউটের জন্য বোতাম চেপে ধরুন) এবং পৃষ্ঠায় টানুন। সীমাবদ্ধ করতে Ctrl, কেন্দ্র থেকে আঁকতে Shift চেপে ধরুন।"
welcome.learn_1_title = "আঁকা"
welcome.learn_2_body = "নির্বাচন করতে ক্লিক করুন, ঘূর্ণন ও স্কিউ হ্যান্ডলের জন্য আবার ক্লিক করুন, স্কেল করতে কোণা টানুন। অ্যারো কী নাজ করে; Shift+অ্যারো দশগুণ দূরে নাজ করে।"
welcome.learn_2_title = "নির্বাচন ও রূপান্তর"
welcome.learn_3_body = "পূরণের জন্য প্যালেটের রঙে বাম-ক্লিক, আউটলাইনের জন্য ডান-ক্লিক করুন। প্রপার্টিজ প্যানেল গ্রেডিয়েন্ট, প্যাটার্ন, টেক্সচার ও মেশ পূরণ সম্পাদনা করে।"
welcome.learn_3_title = "ফিল ও আউটলাইন"
welcome.learn_4_body = "শেপ টুল (F10) নোড সম্পাদনা করে: নোড যোগ করতে সেগমেন্টে ডাবল-ক্লিক, নোড মুছতে নোডে ডাবল-ক্লিক করুন, কাস্প, মসৃণ ও প্রতিসমের জন্য প্রপার্টি বার ব্যবহার করুন।"
welcome.learn_4_title = "নোড"
welcome.learn_5_body = "প্রভাবগুলো সম্পাদনাযোগ্য থাকে: প্রভাব মেনু থেকে প্রভাবের প্যানেল খুলুন, মান বদলান আর অবজেক্ট হালনাগাদ হয়। প্রভাব সমতল করুন সেগুলো স্থায়ী করে।"
welcome.learn_5_title = "ইফেক্ট"
